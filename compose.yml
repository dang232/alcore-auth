# ALcore Auth (Repo C) — VPS staging/prod compose.
# Satisfies .omo/research/task26/vps-owner-runbook.md section 2:
#   AUTH_PORT=8082 AUTH_HOST=127.0.0.1 AUTH_ISSUER=https://auth.alcore.io.vn \
#     docker compose up -d --build
#   curl -s http://127.0.0.1:8082/health
#   curl -s http://127.0.0.1:8082/health/ready
#
# Env keys AUTH_PORT / AUTH_HOST / AUTH_ISSUER / JWT_SECRET match
# src/config.ts reads exactly (getAuthPort/getBindHost/getIssuer/getJwtSecret).

services:
  auth:
    build: .
    # Host-local ONLY — edge ingress is Caddy's job (auth.${DOMAIN} -> 8082).
    # Never 0.0.0.0 here.
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      NODE_ENV: production
      # Container-internal bind MUST be 0.0.0.0: 127.0.0.1 inside the
      # container is the container's own loopback, unreachable via the
      # published port. Host-local restriction is enforced by the
      # 127.0.0.1 ports mapping above, not by this variable. The runbook's
      # host-side AUTH_HOST export is therefore intentionally NOT forwarded.
      AUTH_HOST: "0.0.0.0"
      # Keep 8082 unless the ports mapping above is changed in lockstep.
      AUTH_PORT: ${AUTH_PORT:-8082}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.alcore.io.vn}
      # Optional passthrough: empty -> code defaults (web + apex + localhost
      # dev, src/config.ts). Production sets the explicit triangle
      # (https://web.alcore.io.vn,https://alcore.io.vn,https://auth.alcore.io.vn).
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      # OIDC client registration: exact redirect URIs per product
      # (e.g. libre=https://web.alcore.io.vn/auth/alcore/callback).
      # Required for /oidc/exchange/redirect; missing entry fails closed
      # with invalid_redirect_uri. Same silent-drop rule as Google keys above.
      AUTH_OIDC_CLIENTS: ${AUTH_OIDC_CLIENTS:-}
      # REQUIRED-empty passthrough: forwarded from the owner's host env,
      # never a value in this file. Prod boot without it exits 1 (fail-fast,
      # src/config.ts) — that is the intended behavior, not a misconfig.
      JWT_SECRET: ${JWT_SECRET:-}
      # Rotation passthroughs (optional): empty -> code defaults (kid k1,
      # no previous key, src/config.ts getJwtRotationKeys). Set during
      # overlap windows only; never values in this file.
      JWT_SECRET_KID: ${JWT_SECRET_KID:-}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      JWT_SECRET_PREVIOUS_KID: ${JWT_SECRET_PREVIOUS_KID:-}
      # F0 target topology: managed PostgreSQL for identity state.
      # sqlite (default, empty) keeps the file-backed fallback + auth-data
      # volume below (rollback path in docs/auth-postgres-cutover.md).
      # postgres (+ REQUIRED DATABASE_URL) answers every repository call
      # from PostgreSQL (src/lib/pg-store.ts via Bun's built-in SQL).
      AUTH_STORE_BACKEND: ${AUTH_STORE_BACKEND:-}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # S8 deploy gate: this compose file is production (NODE_ENV=production
      # above), so the throttle default is redis — never silent process-local
      # memory. Prod boot without REDIS_URL still fails fast naming it
      # (resolveThrottleBackend in src/lib/ratelimit.ts, wired in src/index.ts).
      THROTTLE_BACKEND: ${THROTTLE_BACKEND:-redis}
      # Google passthroughs. Compose only substitutes variables the file
      # references, so an unset key here means a value placed in .env is
      # silently dropped and /auth/google/config keeps answering an empty
      # clientId. The client ID is public by design (it ships to browsers);
      # the secret is only needed by the /auth/google/callback code flow.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      # Local `db` is OPTIONAL: production may run sqlite fallback (default,
      # empty AUTH_STORE_BACKEND) or an external/managed PostgreSQL via
      # DATABASE_URL (e.g. VPS auth-pg-1). A crash-looping local `db` (notably
      # missing POSTGRES_PASSWORD on a fresh volume) must never block `auth`
      # startup — see VPS outage where auth-auth-1 stayed Created behind
      # auth-db-1 Restarting. `required: false` keeps the healthy-db wait but
      # lets `auth` start when `db` is absent/unhealthy. Redis stays required:
      # production throttle is redis-backed and fail-closed without it.
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
    # Persist the SQLite identity store across rebuilds. Without this,
    # every image rebuild wipes users/sessions (AUTH_DATABASE_PATH
    # defaults to ./data/auth.sqlite, i.e. /app/data/auth.sqlite here).
    # KEPT under F0: the volume is the rollback fuel (snapshot ponto in
    # docs/auth-postgres-cutover.md) even after the backend flips to pg.
    volumes:
      - auth-data:/app/data
    # Shared private network with the TokenPanel Caddy stack so the
    # auth.${DOMAIN} vhost routes to this container by name (auth:8082).
    # Host runtime state, created once: `docker network create alcore-auth-proxy`.
    networks:
      - alcore-auth-proxy
    restart: unless-stopped

  # F0 target topology substrates (AUTH-owned, identity-only).
  # db holds users/provider-identities/sessions/OIDC-codes/purpose-ledger/
  # exchange-codes (src/lib/pg-schema.sql 001). redis holds throttle
  # counters (auth:* buckets, fail-closed) plus optional revocation cache.
  # Neither service stores business data — the overbuild gate covers both.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - alcore-auth-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-auth} -d $${POSTGRES_DB:-auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - alcore-auth-proxy
    restart: unless-stopped

volumes:
  auth-data:
  pgdata:
  redisdata:

networks:
  alcore-auth-proxy:
    external: true
